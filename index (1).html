<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Will you be my Valentine? 💕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .heart-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .heart-bg .h {
    position: absolute;
    opacity: 0.15;
    animation: floatHeart linear infinite;
    color: #e91e63;
    font-size: 1.5rem;
  }

  @keyframes floatHeart {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 16px 60px rgba(180, 60, 100, 0.18);
    padding: 48px 40px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    min-height: 380px;
    overflow: hidden;
    transition: transform 0.3s ease;
  }
  .card:hover { transform: translateY(-4px); }

  /* Cat SVG */
  .cat-wrap {
    width: 140px;
    height: 140px;
    margin: 0 auto 24px;
    position: relative;
  }
  .cat-wrap svg { width: 100%; height: 100%; }

  /* Heart on cat ear */
  .cat-heart {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 28px;
    animation: heartPop 1.2s ease-in-out infinite;
  }
  @keyframes heartPop {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  /* Question text */
  .question {
    font-size: 1.55rem;
    font-weight: 700;
    color: #4a2040;
    margin-bottom: 32px;
    line-height: 1.3;
  }

  /* Buttons row */
  .btn-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    position: relative;
    min-height: 56px;
  }

  /* Yes button */
  .btn-yes {
    background: linear-gradient(135deg, #f06292, #ec407a);
    color: #fff;
    border: none;
    padding: 14px 38px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(236, 64, 122, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    z-index: 2;
  }
  .btn-yes:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(236, 64, 122, 0.55);
  }
  .btn-yes:active { transform: scale(0.96); }

  /* No button */
  .btn-no {
    background: #f5f0f2;
    color: #9e7080;
    border: 2px solid #e8d0d8;
    padding: 12px 32px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(.68,-.55,.265,1.55);
    position: relative;
    z-index: 1;
  }
  .btn-no:hover {
    background: #efe0e5;
  }

  /* Shy hint */
  .shy-hint {
    margin-top: 18px;
    font-size: 0.78rem;
    color: #c4909e;
    font-style: italic;
  }

  /* === CELEBRATION STATE === */
  .celebration { display: none; }
  .celebration.show { display: block; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

  .celebration .confetti-text {
    font-size: 2.2rem;
    font-weight: 700;
    color: #e91e63;
    margin: 24px 0 8px;
  }
  .celebration .sub-text {
    color: #9e4060;
    font-size: 1rem;
    margin-bottom: 8px;
  }

  /* Confetti burst */
  .confetti-burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall 2.5s ease-in forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* No-count badge (hidden until needed) */
  .no-count {
    font-size: 0.72rem;
    color: #c4909e;
    margin-top: 6px;
    min-height: 1em;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Floating hearts bg -->
<div class="heart-bg" id="heartBg"></div>

<!-- Main card -->
<div class="card" id="mainCard">
  <div class="cat-wrap">
    <!-- Cute cat SVG -->
    <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <!-- Ears -->
      <polygon points="28,52 18,12 52,38" fill="#f0a070"/>
      <polygon points="112,52 122,12 88,38" fill="#f0a070"/>
      <!-- Inner ear -->
      <polygon points="32,48 25,22 46,40" fill="#e88a6a"/>
      <polygon points="108,48 115,22 94,40" fill="#e88a6a"/>
      <!-- Head -->
      <ellipse cx="70" cy="68" rx="46" ry="42" fill="#f5b87a"/>
      <!-- Eyes -->
      <circle cx="52" cy="64" r="5.5" fill="#2c2c2c"/>
      <circle cx="88" cy="64" r="5.5" fill="#2c2c2c"/>
      <!-- Eye shine -->
      <circle cx="54" cy="62" r="2" fill="#fff"/>
      <circle cx="90" cy="62" r="2" fill="#fff"/>
      <!-- Nose -->
      <ellipse cx="70" cy="75" rx="3.5" ry="2.5" fill="#f48fb1"/>
      <!-- Mouth -->
      <path d="M67,77.5 Q70,81 73,77.5" stroke="#d4698a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="30" y1="73" x2="54" y2="75" stroke="#d4a070" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="30" y1="78" x2="54" y2="77" stroke="#d4a070" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="86" y1="75" x2="110" y2="73" stroke="#d4a070" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="86" y1="77" x2="110" y2="78" stroke="#d4a070" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Blush -->
      <ellipse cx="42" cy="74" rx="6" ry="3" fill="#f48fb1" opacity="0.45"/>
      <ellipse cx="98" cy="74" rx="6" ry="3" fill="#f48fb1" opacity="0.45"/>
    </svg>
    <div class="cat-heart">💗</div>
  </div>

  <div class="question" id="questionText">nirali will you be my valentine? 💕</div>

  <div class="btn-row" id="btnRow">
    <button class="btn-yes" id="btnYes">Yes</button>
    <button class="btn-no" id="btnNo">No</button>
  </div>
  <div class="shy-hint" id="shyHint">"No" seems a bit shy 🥺</div>
  <div class="no-count" id="noCount"></div>

  <!-- Celebration (hidden initially) -->
  <div class="celebration" id="celebration">
    <div class="confetti-text">Yayy!! 🎉💕</div>
    <div class="sub-text">You made my day! ✨</div>
  </div>
</div>

<!-- Confetti container -->
<div class="confetti-burst" id="confettiBurst"></div>

<script>
  // ---- Floating hearts background ----
  const heartBg = document.getElementById('heartBg');
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('div');
    h.className = 'h';
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.animationDuration = (6 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 8) + 's';
    h.style.fontSize = (12 + Math.random() * 20) + 'px';
    heartBg.appendChild(h);
  }

  // ---- No button escape logic ----
  const btnNo      = document.getElementById('btnNo');
  const btnRow     = document.getElementById('btnRow');
  const noCount    = document.getElementById('noCount');
  const shyHint    = document.getElementById('shyHint');
  let noClicks     = 0;
  const noMessages = [
    '"No" seems a bit shy 🥺',
    'Aww, "No" is running away! 😂',
    '"No" is getting scared… 👀',
    'Catch it if you can! 😜',
    'Almost… just a little more! 💨',
  ];

  btnNo.addEventListener('click', () => {
    noClicks++;
    // Move the No button to a random spot inside the card
    const cardRect = document.getElementById('mainCard').getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const maxX = cardRect.width - btnRect.width - 20;
    const maxY = cardRect.height - btnRect.height - 20;
    btnNo.style.position = 'absolute';
    btnNo.style.left = (10 + Math.random() * maxX) + 'px';
    btnNo.style.top = (10 + Math.random() * maxY) + 'px';
    btnNo.style.margin = '0';

    // Update hint
    const idx = Math.min(noClicks - 1, noMessages.length - 1);
    shyHint.textContent = noMessages[idx];

    // After 5 clicks, hide the No button entirely
    if (noClicks >= 5) {
      btnNo.style.opacity = '0';
      btnNo.style.transform = 'scale(0)';
      setTimeout(() => { btnNo.style.display = 'none'; }, 450);
      noCount.textContent = 'There is no way out now... 😈💕';
    }
  });

  // ---- Yes button celebration ----
  document.getElementById('btnYes').addEventListener('click', () => {
    document.getElementById('mainCard').querySelector('.btn-row').style.display = 'none';
    shyHint.style.display = 'none';
    noCount.style.display = 'none';
    document.getElementById('celebration').classList.add('show');
    launchConfetti();
  });

  // ---- Confetti ----
  function launchConfetti() {
    const container = document.getElementById('confettiBurst');
    const colors = ['#f06292','#ec407a','#ff80ab','#fff176','#ce93d8','#fff59d','#ef5350','#ab47bc'];
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (40 + Math.random() * 20) + '%';
      p.style.top  = (20 + Math.random() * 20) + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width  = (6 + Math.random() * 8) + 'px';
      p.style.height = (6 + Math.random() * 8) + 'px';
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      p.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      // Spread horizontally
      const spread = (Math.random() - 0.5) * 300;
      p.style.setProperty('--spread', spread + 'px');
      p.style.animation = `confettiFall ${2 + Math.random()*1.5}s ease-in ${Math.random()*0.4}s forwards`;
      // Override: custom horizontal drift via keyframes isn't easy, so use inline transform
      const endX = (Math.random() - 0.5) * 400;
      p.style.animation = 'none';
      p.style.transition = `transform ${1.5 + Math.random()}s cubic-bezier(.2,.8,.3,1), opacity 2s ease`;
      p.style.opacity = 1;
      container.appendChild(p);
      // Animate on next frame
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          p.style.transform = `translate(${endX}px, ${200 + Math.random()*500}px) rotate(${Math.random()*720}deg)`;
          p.style.opacity = 0;
        });
      });
      // Clean up
      setTimeout(() => p.remove(), 3000);
    }
  }
</script>
</body>
</html>
